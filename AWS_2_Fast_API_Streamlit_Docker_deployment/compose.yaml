services:
  api:
    build: .
    image: rock-classifier:local
    command:
      - python
      - -m
      - uvicorn
      - fast_api_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AWS_PROFILE: Super_Dayo
    volumes:
      - "${HOME}/.aws:/root/.aws:ro"
      - model-data:/app/S3data_download
      - torch-cache:/root/.cache/torch
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 300s

  streamlit:
    image: rock-classifier:local
    command:
      - python
      - -m
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      AWS_PROFILE: Super_Dayo
    volumes:
      - "${HOME}/.aws:/root/.aws:ro"
    depends_on:
      api:
        condition: service_healthy

volumes:
  model-data:
  torch-cache: